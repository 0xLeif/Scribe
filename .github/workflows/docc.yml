name: docc
on:
  push:
    branches: ["main"]
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: "pages"
  cancel-in-progress: true
jobs:
  pages:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: macos-15
    steps:
      - name: git checkout
        uses: actions/checkout@v4
      - name: docbuild
        run: |
          xcodebuild docbuild -scheme Scribe \
            -derivedDataPath /tmp/docbuild \
            -destination 'generic/platform=iOS';
          $(xcrun --find docc) process-archive \
            transform-for-static-hosting /tmp/docbuild/Build/Products/Debug-iphoneos/Scribe.doccarchive \
            --output-path docs \
            --hosting-base-path Scribe;
          echo "<script>window.location.href += \"/documentation/scribe\"</script>" > docs/index.html;
      - name: artifacts
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'docs'
      - name: deploy
        id: deployment
        uses: actions/deploy-pages@v4
